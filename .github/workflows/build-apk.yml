name: Build Android APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Use Google Maven Central mirror
        run: mkdir -p ~/.gradle/init.d && cp .github/maven-mirror.gradle ~/.gradle/init.d/maven-mirror.gradle
      - name: Accept Android SDK licenses
        run: SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1) && yes | "$SDKM" --licenses || true
      - name: Build web app
        working-directory: frontend
        run: npm install && npm run build
      - name: Add and sync Android project
        working-directory: frontend
        run: (test -d android || npx cap add android) && npx cap sync android
      - name: Build Debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --max-workers=2 --console=plain --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: podbor-angels-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
